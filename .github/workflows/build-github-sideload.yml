name: Build GitHub Sideload Package

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Package version from Package.appxmanifest, for example 1.6.1.0
        required: true
        default: 1.6.1.0
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} Sideload Package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x64
          - ARM64

    env:
      SIDELOAD_CERT_PASSWORD: ${{ secrets.SIDELOAD_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install 7-Zip-zstd And Stage 7za
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/mcmilk/7-Zip-zstd/releases/latest'
          $asset = $release.assets |
            Where-Object { $_.name -match '^7z.*-zstd-x64\.exe$' -and $_.name -notmatch '-ndm\.exe$' } |
            Select-Object -First 1

          if ($null -eq $asset) {
            throw 'Could not find a Windows x64 7-Zip-zstd installer asset in the latest GitHub release.'
          }

          $installerPath = Join-Path $env:RUNNER_TEMP $asset.name
          $installDirectory = Join-Path $env:RUNNER_TEMP '7zip-zstd'

          if (Test-Path -LiteralPath $installDirectory) {
            Remove-Item -LiteralPath $installDirectory -Recurse -Force
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installerPath

          # NSIS silent install. /D must be the final argument.
          $process = Start-Process -FilePath $installerPath -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "7-Zip-zstd installer failed with exit code $($process.ExitCode)."
          }

          $sevenZip = Get-ChildItem -Path $installDirectory -Filter '7za.exe' -Recurse | Select-Object -First 1
          if ($null -eq $sevenZip) {
            throw "7za.exe was not found in the installed 7-Zip-zstd directory: $installDirectory"
          }

          Copy-Item -LiteralPath $sevenZip.FullName -Destination "$env:GITHUB_WORKSPACE\7za.exe" -Force

      - name: Validate Version Input
        shell: pwsh
        run: |
          if ('${{ inputs.package_version }}' -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "package_version must use a four-part version such as 1.6.1.0."
          }

      - name: Read Package Version
        id: version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content 'FolderRewind/Package.appxmanifest'
          $manifestVersion = $manifest.Package.Identity.Version
          if ($manifestVersion -ne '${{ inputs.package_version }}') {
            throw "The workflow input version does not match Package.appxmanifest."
          }

          $parts = $manifestVersion.Split('.')
          $tagVersion = '{0}.{1}.{2}' -f $parts[0], $parts[1], $parts[2]

          "manifest_version=$manifestVersion" >> $env:GITHUB_OUTPUT
          "release_tag=v$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Decode Sideload Certificate
        id: certificate
        shell: pwsh
        env:
          SIDELOAD_CERT_BASE64: ${{ secrets.SIDELOAD_CERT_BASE64 }}
        run: |
          [xml]$manifest = Get-Content 'FolderRewind/Package.appxmanifest'

          .\.github\scripts\Decode-SideloadCertificate.ps1 `
            -Base64Certificate $env:SIDELOAD_CERT_BASE64 `
            -OutputDirectory "$env:RUNNER_TEMP\folderrewind-cert" `
            -OutputName "folderrewind-sideload.pfx" `
            -CertificatePassword $env:SIDELOAD_CERT_PASSWORD `
            -ExpectedPublisher $manifest.Package.Identity.Publisher

      - name: Import Sideload Certificate
        shell: pwsh
        run: |
          .\.github\scripts\Import-SideloadCertificate.ps1 `
            -CertificatePath "${{ steps.certificate.outputs.certificate_path }}" `
            -CertificatePassword $env:SIDELOAD_CERT_PASSWORD

      - name: Build MSIX Package
        shell: pwsh
        run: |
          dotnet build FolderRewind/FolderRewind.csproj `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -p:CETCompat=false `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:GenerateAppxPackageOnBuild=true `
            -p:GenerateTestArtifacts=false `
            -p:AppxSymbolPackageEnabled=false `
            -p:GenerateAppxSymbolPackage=false `
            -p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\appx\${{ matrix.platform }}\" `
            -p:PackageCertificateKeyFile= `
            -p:PackageCertificatePassword= `
            -p:PackageCertificateThumbprint=${{ steps.certificate.outputs.certificate_thumbprint }} `
            /warnaserror

      - name: Prepare Release Assets
        shell: pwsh
        run: |
          # Release the complete sideload install set instead of only the .msix file.
          .\.github\scripts\Prepare-SideloadPackage.ps1 `
            -PackageRoot "$env:GITHUB_WORKSPACE\artifacts\appx\${{ matrix.platform }}" `
            -Version "${{ steps.version.outputs.manifest_version }}" `
            -Platform "${{ matrix.platform }}" `
            -SevenZipPath "$env:GITHUB_WORKSPACE\7za.exe" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\artifacts\release\${{ matrix.platform }}"

      - name: Publish Self-Contained MSI Payload
        shell: pwsh
        run: |
          # Packaged MSIX and unpackaged MSI builds share bin/obj. Clean the
          # packaged PRI so the MSI publish regenerates a dependency-merged PRI.
          dotnet clean FolderRewind/FolderRewind.csproj `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -p:FolderRewindDistributionChannel=Msi `
            -p:GenerateAppxPackageOnBuild=false

          dotnet publish FolderRewind/FolderRewind.csproj `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -p:FolderRewindDistributionChannel=Msi `
            -p:CETCompat=false `
            -p:Version=${{ steps.version.outputs.manifest_version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.manifest_version }} `
            -p:FileVersion=${{ steps.version.outputs.manifest_version }} `
            -p:InformationalVersion=${{ steps.version.outputs.manifest_version }} `
            -p:GenerateAppxPackageOnBuild=false `
            -o "$env:GITHUB_WORKSPACE\artifacts\msi-publish\${{ matrix.platform }}" `
            /warnaserror

      - name: Build MSI Release Assets
        shell: pwsh
        run: |
          .\.github\scripts\Prepare-MsiPackage.ps1 `
            -ProjectPath "$env:GITHUB_WORKSPACE\Installer\FolderRewind.Installer.wixproj" `
            -PublishDirectory "$env:GITHUB_WORKSPACE\artifacts\msi-publish\${{ matrix.platform }}" `
            -Version "${{ steps.version.outputs.manifest_version }}" `
            -Platform "${{ matrix.platform }}" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\artifacts\release\${{ matrix.platform }}"

      - name: Smoke Test x64 MSI Install And Uninstall
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts\release\${{ matrix.platform }}" -Filter '*.msi' | Select-Object -First 1
          if ($null -eq $msi) {
            throw 'MSI release asset was not found.'
          }

          $installDirectory = Join-Path $env:RUNNER_TEMP 'FolderRewind-msi-smoke'
          $install = Start-Process msiexec.exe `
            -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart', "INSTALLFOLDER=`"$installDirectory`"") `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "MSI install smoke test failed with exit code $($install.ExitCode)."
          }

          foreach ($requiredPath in @(
            'FolderRewind.exe',
            'FolderRewind.dll',
            'FolderRewind.deps.json',
            'FolderRewind.runtimeconfig.json',
            'FolderRewind.pri',
            'Microsoft.UI.Xaml.dll',
            'Microsoft.UI.Xaml.Controls.pri',
            'Microsoft.WindowsAppRuntime.dll',
            '7za.exe',
            'Assets\logo.ico'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDirectory $requiredPath))) {
              throw "MSI install is missing required payload: $requiredPath"
            }
          }

          $installedSymbols = Get-ChildItem -LiteralPath $installDirectory -Filter '*.pdb' -File -Recurse -ErrorAction SilentlyContinue
          if ($installedSymbols) {
            throw "MSI installed development debug symbols: $($installedSymbols.FullName -join ', ')"
          }

          # Installation alone did not catch the original broken PRI regression. Launch
          # the installed executable and require a real top-level window to appear.
          $executable = Join-Path $installDirectory 'FolderRewind.exe'
          $appProcess = Start-Process -FilePath $executable -WorkingDirectory $installDirectory -PassThru
          try {
            $launchDeadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Seconds 1
              $appProcess.Refresh()
              if ($appProcess.HasExited) {
                throw "Installed FolderRewind exited before opening a window (exit code $($appProcess.ExitCode))."
              }
            } while ($appProcess.MainWindowHandle -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $launchDeadline)

            if ($appProcess.MainWindowHandle -eq [IntPtr]::Zero) {
              throw 'Installed FolderRewind stayed headless and did not open a window within 30 seconds.'
            }
          }
          finally {
            if (-not $appProcess.HasExited) {
              Stop-Process -Id $appProcess.Id -Force
              $appProcess.WaitForExit()
            }
          }

          # Build a higher-versioned test MSI and install it without INSTALLFOLDER.
          # Registry search in Package.wxs must retain the first install's custom path.
          $upgradeDirectory = Join-Path $env:RUNNER_TEMP 'FolderRewind-msi-upgrade'
          .\.github\scripts\Prepare-MsiPackage.ps1 `
            -ProjectPath "$env:GITHUB_WORKSPACE\Installer\FolderRewind.Installer.wixproj" `
            -PublishDirectory "$env:GITHUB_WORKSPACE\artifacts\msi-publish\${{ matrix.platform }}" `
            -Version '99.99.99.0' `
            -Platform '${{ matrix.platform }}' `
            -OutputDirectory $upgradeDirectory

          $upgradeMsi = Get-ChildItem $upgradeDirectory -Filter '*.msi' | Select-Object -First 1
          if ($null -eq $upgradeMsi) {
            throw 'MSI upgrade test asset was not found.'
          }

          $upgrade = Start-Process msiexec.exe -ArgumentList @('/i', $upgradeMsi.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            throw "MSI upgrade smoke test failed with exit code $($upgrade.ExitCode)."
          }

          if (-not (Test-Path -LiteralPath (Join-Path $installDirectory 'FolderRewind.exe'))) {
            throw 'MSI upgrade did not retain the original custom install directory.'
          }

          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $upgradeMsi.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "MSI uninstall smoke test failed with exit code $($uninstall.ExitCode)."
          }

          if (Test-Path -LiteralPath $installDirectory) {
            throw "MSI uninstall left application files at $installDirectory"
          }

      - name: Upload Intermediate Assets
        uses: actions/upload-artifact@v4
        with:
          name: sideload-${{ matrix.platform }}
          path: artifacts/release/${{ matrix.platform }}/*

      - name: Remove Temporary Certificate
        if: always()
        shell: pwsh
        run: |
          .\.github\scripts\Remove-SideloadCertificate.ps1 `
            -CertificatePath "${{ steps.certificate.outputs.certificate_path }}" `
            -Thumbprint "${{ steps.certificate.outputs.certificate_thumbprint }}"

  publish-release:
    name: Publish GitHub Release Assets
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Release Assets
        uses: actions/download-artifact@v4
        with:
          pattern: sideload-*
          path: artifacts/final
          merge-multiple: true

      - name: Read Package Version
        id: version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content 'FolderRewind/Package.appxmanifest'
          $manifestVersion = $manifest.Package.Identity.Version
          if ($manifestVersion -ne '${{ inputs.package_version }}') {
            throw "The workflow input version does not match Package.appxmanifest."
          }

          $parts = $manifestVersion.Split('.')
          $tagVersion = '{0}.{1}.{2}' -f $parts[0], $parts[1], $parts[2]

          "manifest_version=$manifestVersion" >> $env:GITHUB_OUTPUT
          "release_tag=v$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Publish Assets To Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\.github\scripts\Publish-ReleaseAssets.ps1 `
            -Tag "${{ steps.version.outputs.release_tag }}" `
            -ReleaseName "FolderRewind ${{ steps.version.outputs.manifest_version }}" `
            -TargetCommit "$env:GITHUB_SHA" `
            -AssetsDirectory "$env:GITHUB_WORKSPACE\artifacts\final"
