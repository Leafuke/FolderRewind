name: Build GitHub Setup Installers

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Package version from Package.appxmanifest
        required: false
        type: string
      run_installer_lifecycle:
        description: Optional isolated installation and fault-injection diagnostics
        type: boolean
        default: false
      sevenzip_release:
        description: Optional upstream 7-Zip-zstd release tag (empty selects latest)
        type: string
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} Setup Installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x64
          - ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Stage Architecture-Specific 7-Zip-zstd From Upstream Metadata
        shell: pwsh
        env:
          SEVENZIP_RELEASE: ${{ inputs.sevenzip_release }}
        run: |
          $payload = .\.github\scripts\Stage-SevenZip.ps1 -Platform '${{ matrix.platform }}' -ReleaseTag $env:SEVENZIP_RELEASE | Select-Object -Last 1
          "SEVENZIP_PAYLOAD=$payload" >> $env:GITHUB_ENV

      - name: Ensure WinApp CLI For UI Evidence
        if: matrix.platform == 'x64' && inputs.run_installer_lifecycle
        shell: pwsh
        run: |
          if (-not (Get-Command winapp -ErrorAction SilentlyContinue)) {
            winget install --id Microsoft.WinAppCli --exact --version 0.7.0 --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw 'WinApp CLI setup failed.' }
          }
          "$env:LOCALAPPDATA\Microsoft\WindowsApps" >> $env:GITHUB_PATH

      - name: Validate Version Input
        shell: pwsh
        run: |
          if ('${{ inputs.package_version }}' -and '${{ inputs.package_version }}' -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw "package_version must use major.minor.build.0; MSI revision must be zero."
          }

      - name: Verify EXE-Only Release Policy
        shell: pwsh
        run: |
          .\.github\scripts\Test-SetupReleaseAssets.ps1 -ResultDirectory "$env:RUNNER_TEMP\setup-release-policy"

      - name: Read Package Version
        id: version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content 'FolderRewind/Package.appxmanifest'
          $manifestVersion = $manifest.Package.Identity.Version
          if ('${{ inputs.package_version }}' -and $manifestVersion -ne '${{ inputs.package_version }}') {
            throw "The workflow input version does not match Package.appxmanifest."
          }

          $parts = $manifestVersion.Split('.')
          $tagVersion = '{0}.{1}.{2}' -f $parts[0], $parts[1], $parts[2]

          "manifest_version=$manifestVersion" >> $env:GITHUB_OUTPUT
          "release_tag=v$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Build Unsigned MSIX Regression Package
        shell: pwsh
        run: |
          # MSIX targets probe for mspdbcmf.exe whenever packaging input contains a PDB,
          # even when symbol-package generation is disabled. Do not emit unused PDBs.
          # MSIX remains a build regression check; GitHub publishes Setup EXE only.
          dotnet build FolderRewind/FolderRewind.csproj `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -p:CETCompat=false `
            -p:SevenZipExecutable="$env:SEVENZIP_PAYLOAD" `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxBundle=Never `
            -p:GenerateAppxPackageOnBuild=true `
            -p:GenerateTestArtifacts=false `
            -p:AppxSymbolPackageEnabled=false `
            -p:GenerateAppxSymbolPackage=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\appx\${{ matrix.platform }}\" `
            -p:PackageCertificateKeyFile= `
            -p:PackageCertificatePassword= `
            -p:PackageCertificateThumbprint= `
            -p:AppxPackageSigningEnabled=false `
            /warnaserror

      - name: Publish Self-Contained MSI Payload
        shell: pwsh
        run: |
          # Packaged MSIX and unpackaged MSI builds share bin/obj. Clean the
          # packaged PRI so the MSI publish regenerates a dependency-merged PRI.
          dotnet clean FolderRewind/FolderRewind.csproj `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -p:FolderRewindDistributionChannel=Msi `
            -p:GenerateAppxPackageOnBuild=false

          dotnet publish FolderRewind/FolderRewind.csproj `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -p:FolderRewindDistributionChannel=Msi `
            -p:CETCompat=false `
            -p:SevenZipExecutable="$env:SEVENZIP_PAYLOAD" `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.manifest_version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.manifest_version }} `
            -p:FileVersion=${{ steps.version.outputs.manifest_version }} `
            -p:InformationalVersion=${{ steps.version.outputs.manifest_version }} `
            -p:GenerateAppxPackageOnBuild=false `
            -o "$env:GITHUB_WORKSPACE\artifacts\msi-publish\${{ matrix.platform }}" `
            /warnaserror

      - name: Build Setup And Internal MSI Payload
        id: package
        shell: pwsh
        run: |
          .\.github\scripts\Prepare-MsiPackage.ps1 `
            -ProjectPath "$env:GITHUB_WORKSPACE\Installer\FolderRewind.Installer.wixproj" `
            -PublishDirectory "$env:GITHUB_WORKSPACE\artifacts\msi-publish\${{ matrix.platform }}" `
            -Version "${{ steps.version.outputs.manifest_version }}" `
            -Platform "${{ matrix.platform }}" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\artifacts\installer-packages\${{ matrix.platform }}"

      - name: Verify Native Registry Semantics And Release Policy
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          .\.github\scripts\Test-InstallerNative.ps1 -ResultDirectory artifacts/msi-validation/native
          .\.github\scripts\Test-SetupReleaseAssets.ps1 -ResultDirectory artifacts/msi-validation/release-policy

      - name: Verify Missing Resources Block Packaging
        shell: pwsh
        run: |
          .\.github\scripts\Test-MsiPayloadFailures.ps1 `
            -Directory "$env:GITHUB_WORKSPACE\artifacts\msi-publish\${{ matrix.platform }}" `
            -ResultPath "$env:GITHUB_WORKSPACE\artifacts\installer-packages\${{ matrix.platform }}\resource-negative-tests.json"

      - name: Validate x64 MSI Lifecycle In An Empty Installation Context
        if: matrix.platform == 'x64' && inputs.run_installer_lifecycle
        shell: pwsh
        run: |
          .\.github\scripts\Test-MsiInstallation.ps1 `
            -MsiPath "$env:GITHUB_WORKSPACE\artifacts\installer-packages\x64\FolderRewind_${{ steps.version.outputs.manifest_version }}_x64.msi" `
            -PublishDirectory "$env:GITHUB_WORKSPACE\artifacts\msi-publish\x64" `
            -ResultDirectory "$env:GITHUB_WORKSPACE\artifacts\msi-validation"

          .\.github\scripts\Test-MsiBoundaries.ps1 `
            -BaseMsi "$env:GITHUB_WORKSPACE\artifacts\msi-validation\base-fixture\FolderRewind_${{ steps.version.outputs.manifest_version }}_x64.msi" `
            -UpgradeMsi "$env:GITHUB_WORKSPACE\artifacts\msi-validation\upgrade-fixture\FolderRewind_99.99.99.0_x64.msi" `
            -ResultDirectory "$env:GITHUB_WORKSPACE\artifacts\msi-validation\boundaries"

          .\.github\scripts\Test-MsiBundleInstallation.ps1 `
            -FixtureMsi "$env:GITHUB_WORKSPACE\artifacts\msi-validation\base-fixture\FolderRewind_${{ steps.version.outputs.manifest_version }}_x64.msi" `
            -ResultDirectory "$env:GITHUB_WORKSPACE\artifacts\msi-validation\bundle" -IncludeFailureProbe

      - name: Upload Installer Validation Evidence
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: msi-validation-x64
          path: artifacts/msi-validation/**

      - name: Stage EXE-Only Public Release Assets
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          .\.github\scripts\Prepare-SetupReleaseAssets.ps1 `
            -SourceDirectory "$env:GITHUB_WORKSPACE\artifacts\installer-packages\${{ matrix.platform }}" `
            -Version "${{ steps.version.outputs.manifest_version }}" `
            -Platform "${{ matrix.platform }}" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\artifacts\release\${{ matrix.platform }}"

      - name: Upload Setup EXE And SHA-256
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.platform }}
          path: artifacts/release/${{ matrix.platform }}/*

      - name: Record Candidate Identity And Incomplete Acceptance
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          .\.github\scripts\New-InstallerCandidateManifest.ps1 `
            -PackageDirectory artifacts/installer-packages `
            -OutputDirectory artifacts/candidate-evidence `
            -Version '${{ steps.version.outputs.manifest_version }}' `
            -Architectures '${{ matrix.platform }}'

      - name: Upload Candidate Evidence
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.platform }}
          path: |
            artifacts/candidate-evidence/*.json
            artifacts/candidate-evidence/*.log
